name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  linux:
    name: Rust (linux) + viewer
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
      - name: Viewer
        working-directory: viewer
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bun run test
          bun run build
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy -p rd-proto -p rd-flow -p rd-agent-core -p rd-gateway --all-targets -- -D warnings
      - name: Test
        run: cargo test -p rd-proto -p rd-flow -p rd-agent-core -p rd-gateway

  macos:
    name: Rust (macOS agent)
    runs-on: macos-26  # screencapturekit's Swift bridge (apple-metal) needs the macOS 26 SDK
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy -p rd-platform-macos -p rd-agent --all-targets -- -D warnings
      - name: Test (no capture / no input posting in CI)
        run: cargo test -p rd-platform-macos -p rd-agent
