name: Desktop

# rd Desktop (clients/desktop): Windows (portable exe + per-user NSIS installer) and macOS
# (universal .dmg) builds, plus the Windows agent (per-user installer, and rd-agent.exe +
# rd-agentw.exe zipped), as workflow artifacts; a desktop-v* tag also publishes them as a GitHub Release. (Path filters do
# not apply to tag pushes, so every desktop-v* tag builds.) release.yml (changesets) creates the
# tags and dispatches this workflow on them.
on:
  push:
    branches: [main]
    tags: ["desktop-v*"]
    paths:
      - "clients/desktop/**"
      - "crates/rd-proto/**"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - id: version
        run: |
          bun tools/release/sync-desktop-version.ts --check
          v="$(sed -n 's/^version = "\(.*\)"$/\1/p' clients/desktop/src-tauri/Cargo.toml | head -n1)"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/desktop-v* && "${GITHUB_REF_NAME#desktop-v}" != "$v" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match clients/desktop/src-tauri/Cargo.toml version $v"
            exit 1
          fi

  windows:
    name: Windows (exe + NSIS installer)
    needs: version
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: clients/desktop/src-tauri -> target
      - uses: oven-sh/setup-bun@v2

      - name: Tauri CLI (version pinned in clients/desktop/package.json)
        working-directory: clients/desktop
        run: bun install --frozen-lockfile

      - name: Build
        working-directory: clients/desktop
        run: bun run tauri build --ci --bundles nsis -- --locked

      - name: Test
        working-directory: clients/desktop/src-tauri
        # Same profile and features as the build, so nothing is compiled twice.
        run: cargo test --locked --release --features tauri/custom-protocol

      - name: Clippy
        working-directory: clients/desktop/src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Collect
        run: |
          v="${{ needs.version.outputs.version }}"
          src=clients/desktop/src-tauri/target/release
          mkdir -p out
          cp "$src/rd-desktop.exe" "out/rd-desktop-$v-x64-portable.exe"
          cp "$src"/bundle/nsis/*-setup.exe "out/rd-desktop-$v-x64-setup.exe"
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: rd-desktop-${{ needs.version.outputs.version }}-windows-x64
          path: out/*
          if-no-files-found: error

  windows-agent:
    name: Windows agent (installer + zip)
    needs: version
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --locked --release -p rd-agent

      # Windows Server images have no Media Foundation (mfplat.dll) unless the feature is added;
      # without it rd-agent.exe does not even start.
      - name: Media Foundation
        shell: pwsh
        run: |
          $mf = Join-Path $env:WINDIR 'System32\mfplat.dll'
          if (-not (Test-Path $mf)) { Install-WindowsFeature Server-Media-Foundation | Out-Null }
          if (-not (Test-Path $mf)) { throw 'Media Foundation is missing' }

      # The shipped exe starts and encodes (no GPU here: the software encoder).
      - name: Smoke test
        run: |
          target/release/rd-agent.exe --version
          target/release/rd-agent.exe selftest --synthetic --encoder software --size 640x360 --seconds 2

      - name: Collect
        shell: pwsh
        run: |
          $v = '${{ needs.version.outputs.version }}'
          New-Item -ItemType Directory -Force out, pkg | Out-Null
          # The key tables in rd-agent derive from Chromium (BSD-3-Clause): ship the notice.
          Copy-Item target/release/rd-agent.exe, target/release/rd-agentw.exe, THIRD_PARTY_NOTICES.md pkg
          Compress-Archive -Path pkg/* -DestinationPath "out/rd-agent-$v-windows-x64.zip"
          Get-ChildItem out

      - name: NSIS
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            $nsis = 'C:\Program Files (x86)\NSIS'
            if (-not (Test-Path "$nsis\makensis.exe")) { choco install nsis -y --no-progress }
            Add-Content $env:GITHUB_PATH $nsis
          }

      - name: Installer
        shell: pwsh
        run: |
          $v = '${{ needs.version.outputs.version }}'
          makensis -V2 "-DVERSION=$v" "-DSRC=$PWD\pkg" "-DOUTFILE=$PWD\out\rd-agent-$v-windows-x64-setup.exe" packaging/windows/rd-agent.nsi
          if ($LASTEXITCODE) { throw "makensis failed: $LASTEXITCODE" }
          Get-ChildItem out

      # Silent install and uninstall (no config here, so the agent is not started).
      - name: Installer smoke test
        shell: pwsh
        run: |
          $v = '${{ needs.version.outputs.version }}'
          $dir = Join-Path $env:RUNNER_TEMP 'rd-agent'
          $key = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\rd-agent'
          $p = Start-Process "out\rd-agent-$v-windows-x64-setup.exe" -ArgumentList '/S', "/D=$dir" -PassThru
          $p.WaitForExit()
          if ($p.ExitCode) { throw "installer exit code $($p.ExitCode)" }
          foreach ($f in 'rd-agent.exe', 'rd-agentw.exe', 'uninstall.exe') {
            if (-not (Test-Path "$dir\$f")) { throw "$f was not installed" }
          }
          if ((Get-ItemProperty $key).DisplayVersion -ne $v) { throw 'no Apps entry for this version' }
          & "$dir\rd-agent.exe" --version
          # The uninstaller copies itself to %TEMP% and returns at once.
          Start-Process "$dir\uninstall.exe" -ArgumentList '/S' -Wait
          $deadline = (Get-Date).AddSeconds(30)
          while ((Test-Path $key) -and (Get-Date) -lt $deadline) { Start-Sleep -Milliseconds 250 }
          if ((Test-Path $key) -or (Test-Path "$dir\rd-agent.exe")) { throw 'the uninstall left files or the Apps entry' }
          'install and uninstall OK'

      - uses: actions/upload-artifact@v4
        with:
          name: rd-agent-${{ needs.version.outputs.version }}-windows-x64
          path: out/*
          if-no-files-found: error

  macos:
    name: macOS (universal .dmg)
    needs: version
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
          targets: aarch64-apple-darwin,x86_64-apple-darwin
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: clients/desktop/src-tauri -> target
      - uses: oven-sh/setup-bun@v2

      - name: Tauri CLI (version pinned in clients/desktop/package.json)
        working-directory: clients/desktop
        run: bun install --frozen-lockfile

      - name: Build
        working-directory: clients/desktop
        # Ad-hoc signed (bundle.macOS.signingIdentity "-"): no Apple developer account.
        run: bun run tauri build --ci --target universal-apple-darwin --bundles app,dmg -- --locked

      - name: Test
        working-directory: clients/desktop/src-tauri
        # Reuses the arm64 half of the universal build.
        run: cargo test --locked --release --target aarch64-apple-darwin --features tauri/custom-protocol

      - name: Clippy
        working-directory: clients/desktop/src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Collect
        run: |
          v="${{ needs.version.outputs.version }}"
          bundle=clients/desktop/src-tauri/target/universal-apple-darwin/release/bundle
          app="$bundle/macos/rd Desktop.app"
          lipo -archs "$app/Contents/MacOS/rd-desktop"
          codesign --verify --strict --verbose=2 "$app"
          mkdir -p out
          cp "$bundle"/dmg/*.dmg "out/rd-desktop-$v-macos-universal.dmg"
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: rd-desktop-${{ needs.version.outputs.version }}-macos-universal
          path: out/*
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: [version, windows, windows-agent, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # gh release create
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: rd-*
          path: out
          merge-multiple: true
      - name: Checksums
        run: cd out && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ needs.version.outputs.version }}
        run: |
          # This version's section of the changelog (written by changesets), if there is one.
          changes="$(awk -v h="## $V" '$0 == h {f = 1; next} /^## / && f {exit} f' clients/desktop/CHANGELOG.md 2>/dev/null | sed '/./,$!d' || true)"
          {
            if [[ -n "${changes//[[:space:]]/}" ]]; then
              printf '%s\n\n' "$changes"
            fi
            cat <<NOTES
          Unsigned builds; see clients/desktop/README.md for installing.

          Windows 10/11 (x64). SmartScreen asks once: More info -> Run anyway.
          - rd-desktop-$V-x64-setup.exe: per-user installer (no admin rights)
          - rd-desktop-$V-x64-portable.exe: single exe, no install

          macOS 12+ (Apple silicon and Intel). First start: System Settings -> Privacy & Security -> Open Anyway. Grabbing Cmd+Tab etc. needs the Accessibility permission (the app asks).
          - rd-desktop-$V-macos-universal.dmg

          Windows agent, for the PC you connect to (Windows 10 1703+/11, x64; setup: docs/setup-windows.md). SmartScreen asks once: More info -> Run anyway.
          - rd-agent-$V-windows-x64-setup.exe: per-user installer (no admin rights); it offers the setup (gateway, machine id, token) at the end
          - rd-agent-$V-windows-x64.zip: the same programs to unpack yourself (unblock the zip first: Properties -> Unblock)
          NOTES
          } > notes.md
          cat notes.md
          gh release create "$GITHUB_REF_NAME" out/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "rd Desktop $V" \
            --notes-file notes.md
