name: Desktop

# rd Desktop (clients/desktop): Windows (per-user NSIS installer + portable exe) and macOS
# (universal .dmg) builds as workflow artifacts, with the signed updater files (docs/updates.md).
# A desktop-v* tag also publishes them as a GitHub Release and then points the update manifest
# (desktop.json on the `updates` release) at it. release.yml (changesets) creates the tags and
# dispatches this workflow on them. (Path filters do not apply to tag pushes, so every desktop-v*
# tag builds.) Pull requests build too, but never publish; without the signing secrets (pull
# requests from forks) the builds are unsigned and have no updater files.
#
# Secrets: TAURI_SIGNING_PRIVATE_KEY + TAURI_SIGNING_PRIVATE_KEY_PASSWORD (update signatures),
# MACOS_CERTIFICATE + MACOS_CERTIFICATE_PASSWORD (the "rd Code Signing" certificate).
on:
  push:
    branches: [main]
    tags: ["desktop-v*"]
    paths:
      - "clients/desktop/**"
      - "crates/rd-proto/**"
      - "tools/release/**"
      - ".github/actions/macos-signing/**"
      - ".github/workflows/desktop.yml"
  pull_request:
    paths:
      - "clients/desktop/**"
      - "crates/rd-proto/**"
      - "tools/release/**"
      - ".github/actions/macos-signing/**"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - id: version
        run: |
          bun tools/release/sync-versions.ts --check
          v="$(bun tools/release/sync-versions.ts --print rd-desktop)"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          release=false
          if [[ "$GITHUB_REF" == refs/tags/desktop-v* ]]; then
            if [[ "${GITHUB_REF_NAME#desktop-v}" != "$v" ]]; then
              echo "::error::tag $GITHUB_REF_NAME does not match the rd-desktop version $v"
              exit 1
            fi
            release=true
          fi
          echo "release=$release" >> "$GITHUB_OUTPUT"

  windows:
    name: Windows (installer + portable exe)
    needs: version
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: clients/desktop/src-tauri -> target
      - uses: oven-sh/setup-bun@v2

      - name: Tauri CLI (version pinned in clients/desktop/package.json)
        working-directory: clients/desktop
        run: bun install --frozen-lockfile

      - name: Build
        working-directory: clients/desktop
        run: |
          # With the update-signing key, Tauri also signs the installer for the updater
          # (setup.exe.sig). A release must have it.
          config='{}'
          if [[ -n "$TAURI_SIGNING_PRIVATE_KEY" ]]; then
            config='{"bundle":{"createUpdaterArtifacts":true}}'
          elif [[ "${{ needs.version.outputs.release }}" == true ]]; then
            echo "::error::a release needs the TAURI_SIGNING_PRIVATE_KEY secret"
            exit 1
          else
            echo "::warning::no TAURI_SIGNING_PRIVATE_KEY: building without updater signatures"
          fi
          bun run tauri build --ci --bundles nsis --config "$config" -- --locked

      - name: Test
        working-directory: clients/desktop/src-tauri
        # Same profile and features as the build, so nothing is compiled twice.
        run: cargo test --locked --release --features tauri/custom-protocol

      - name: Clippy
        working-directory: clients/desktop/src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Collect
        run: |
          v="${{ needs.version.outputs.version }}"
          src=clients/desktop/src-tauri/target/release
          mkdir -p out
          cp "$src/rd-desktop.exe" "out/rd-desktop-$v-x64-portable.exe"
          setup=("$src"/bundle/nsis/*-setup.exe)
          cp "${setup[0]}" "out/rd-desktop-$v-x64-setup.exe"
          if [[ -f "${setup[0]}.sig" ]]; then
            cp "${setup[0]}.sig" "out/rd-desktop-$v-x64-setup.exe.sig"
          fi
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: rd-desktop-${{ needs.version.outputs.version }}-windows-x64
          path: out/*
          if-no-files-found: error

  macos:
    name: macOS (universal .dmg)
    needs: version
    runs-on: macos-15
    timeout-minutes: 45
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
          targets: aarch64-apple-darwin,x86_64-apple-darwin
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: clients/desktop/src-tauri -> target
      - uses: oven-sh/setup-bun@v2

      - name: Signing keychain
        id: signing
        uses: ./.github/actions/macos-signing
        with:
          certificate: ${{ secrets.MACOS_CERTIFICATE }}
          password: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}

      - name: Tauri CLI (version pinned in clients/desktop/package.json)
        working-directory: clients/desktop
        run: bun install --frozen-lockfile

      - name: Build
        working-directory: clients/desktop
        env:
          IDENTITY: ${{ steps.signing.outputs.identity }}
          RELEASE: ${{ needs.version.outputs.release }}
        run: |
          # Signed with "rd Code Signing" (so the Accessibility permission survives updates),
          # else ad-hoc (tauri.conf.json: signingIdentity "-"). With the update-signing key,
          # Tauri also writes the updater archive (.app.tar.gz) and its .sig.
          if [[ "$RELEASE" == true && ( -z "$IDENTITY" || -z "$TAURI_SIGNING_PRIVATE_KEY" ) ]]; then
            echo "::error::a release needs the MACOS_CERTIFICATE and TAURI_SIGNING_PRIVATE_KEY secrets"
            exit 1
          fi
          config="$(jq -cn --arg identity "$IDENTITY" --arg key "$TAURI_SIGNING_PRIVATE_KEY" '{bundle: (
            (if $key != "" then {createUpdaterArtifacts: true} else {} end)
            + (if $identity != "" then {macOS: {signingIdentity: $identity}} else {} end))}')"
          echo "config overrides: $config"
          bun run tauri build --ci --target universal-apple-darwin --bundles app,dmg --config "$config" -- --locked

      - name: Test
        working-directory: clients/desktop/src-tauri
        # Reuses the arm64 half of the universal build.
        run: cargo test --locked --release --target aarch64-apple-darwin --features tauri/custom-protocol

      - name: Clippy
        working-directory: clients/desktop/src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Collect
        env:
          SIGNED: ${{ steps.signing.outputs.available }}
        run: |
          v="${{ needs.version.outputs.version }}"
          bundle=clients/desktop/src-tauri/target/universal-apple-darwin/release/bundle
          app="$bundle/macos/rd Desktop.app"
          lipo -archs "$app/Contents/MacOS/rd-desktop"
          codesign --verify --strict --verbose=2 "$app"
          codesign -d -r- "$app"
          if [[ "$SIGNED" == true ]]; then
            # The designated requirement must name the certificate, not a per-build hash:
            # that is what keeps the Accessibility permission across updates.
            codesign -d -r- "$app" 2>&1 | grep -q 'certificate leaf = H"' \
              || { echo "::error::rd Desktop.app is not signed with the certificate"; exit 1; }
          fi
          mkdir -p out
          cp "$bundle"/dmg/*.dmg "out/rd-desktop-$v-macos-universal.dmg"
          tarball=("$bundle"/macos/*.app.tar.gz)
          if [[ -f "${tarball[0]}" ]]; then
            cp "${tarball[0]}" "out/rd-desktop-$v-macos-universal.app.tar.gz"
            cp "${tarball[0]}.sig" "out/rd-desktop-$v-macos-universal.app.tar.gz.sig"
          fi
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: rd-desktop-${{ needs.version.outputs.version }}-macos-universal
          path: out/*
          if-no-files-found: error

  release:
    name: Release
    if: needs.version.outputs.release == 'true'
    needs: [version, windows, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # gh release create / upload
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/download-artifact@v4
        with:
          pattern: rd-desktop-*
          path: out
          merge-multiple: true
      - name: Checksums
        run: cd out && sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ needs.version.outputs.version }}
        run: |
          # This version's section of the changelog (written by changesets), if there is one.
          changes="$(awk -v h="## $V" '$0 == h {f = 1; next} /^## / && f {exit} f' clients/desktop/CHANGELOG.md 2>/dev/null | sed '/./,$!d' || true)"
          {
            if [[ -n "${changes//[[:space:]]/}" ]]; then
              printf '%s\n\n' "$changes"
            fi
            cat <<NOTES
          rd Desktop 1.5.0 and later update themselves (docs/updates.md); install by hand only the first time. See clients/desktop/README.md for installing.

          Windows 10/11 (x64). Not code-signed: SmartScreen asks once (More info -> Run anyway).
          - rd-desktop-$V-x64-setup.exe: per-user installer (no admin rights)
          - rd-desktop-$V-x64-portable.exe: single exe, no install (does not update itself)

          macOS 12+ (Apple silicon and Intel). Signed with the project's own certificate, not notarized: the first start needs System Settings -> Privacy & Security -> Open Anyway. Grabbing Cmd+Tab etc. needs the Accessibility permission (the app asks).
          - rd-desktop-$V-macos-universal.dmg

          The .sig, .app.tar.gz and SHA256SUMS.txt files are for the updater and for checking downloads.
          NOTES
          } > notes.md
          cat notes.md
          gh release create "$GITHUB_REF_NAME" out/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "rd Desktop $V" \
            --notes-file notes.md
      - name: Update manifest
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ needs.version.outputs.version }}
        run: |
          bun tools/release/manifest.ts --package rd-desktop --version "$V" \
            --platform "windows-x86_64=out/rd-desktop-$V-x64-setup.exe" \
            --platform "darwin-aarch64,darwin-x86_64=out/rd-desktop-$V-macos-universal.app.tar.gz" \
            --out desktop.json
          cat desktop.json
          bash tools/release/publish-manifest.sh desktop.json
