name: Desktop

# rd Desktop (clients/desktop): Windows (portable exe + per-user NSIS installer) and macOS
# (universal .dmg) builds as workflow artifacts; a desktop-v* tag also publishes them as a
# GitHub Release. (Path filters do not apply to tag pushes, so every desktop-v* tag builds.)
on:
  push:
    branches: [main]
    tags: ["desktop-v*"]
    paths:
      - "clients/desktop/**"
      - "crates/rd-proto/**"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: |
          v="$(sed -n 's/^version = "\(.*\)"$/\1/p' clients/desktop/src-tauri/Cargo.toml | head -n1)"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/desktop-v* && "${GITHUB_REF_NAME#desktop-v}" != "$v" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match clients/desktop/src-tauri/Cargo.toml version $v"
            exit 1
          fi

  windows:
    name: Windows (exe + NSIS installer)
    needs: version
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: clients/desktop/src-tauri -> target
      - uses: oven-sh/setup-bun@v2

      - name: Tauri CLI (version pinned in clients/desktop/package.json)
        working-directory: clients/desktop
        run: bun install --frozen-lockfile

      - name: Build
        working-directory: clients/desktop
        run: bun run tauri build --ci --bundles nsis -- --locked

      - name: Test
        working-directory: clients/desktop/src-tauri
        # Same profile and features as the build, so nothing is compiled twice.
        run: cargo test --locked --release --features tauri/custom-protocol

      - name: Clippy
        working-directory: clients/desktop/src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Collect
        run: |
          v="${{ needs.version.outputs.version }}"
          src=clients/desktop/src-tauri/target/release
          mkdir -p out
          cp "$src/rd-desktop.exe" "out/rd-desktop-$v-x64-portable.exe"
          cp "$src"/bundle/nsis/*-setup.exe "out/rd-desktop-$v-x64-setup.exe"
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: rd-desktop-${{ needs.version.outputs.version }}-windows-x64
          path: out/*
          if-no-files-found: error

  macos:
    name: macOS (universal .dmg)
    needs: version
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
          targets: aarch64-apple-darwin,x86_64-apple-darwin
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: clients/desktop/src-tauri -> target
      - uses: oven-sh/setup-bun@v2

      - name: Tauri CLI (version pinned in clients/desktop/package.json)
        working-directory: clients/desktop
        run: bun install --frozen-lockfile

      - name: Build
        working-directory: clients/desktop
        # Ad-hoc signed (bundle.macOS.signingIdentity "-"): no Apple developer account.
        run: bun run tauri build --ci --target universal-apple-darwin --bundles app,dmg -- --locked

      - name: Test
        working-directory: clients/desktop/src-tauri
        # Reuses the arm64 half of the universal build.
        run: cargo test --locked --release --target aarch64-apple-darwin --features tauri/custom-protocol

      - name: Clippy
        working-directory: clients/desktop/src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Collect
        run: |
          v="${{ needs.version.outputs.version }}"
          bundle=clients/desktop/src-tauri/target/universal-apple-darwin/release/bundle
          app="$bundle/macos/rd Desktop.app"
          lipo -archs "$app/Contents/MacOS/rd-desktop"
          codesign --verify --strict --verbose=2 "$app"
          mkdir -p out
          cp "$bundle"/dmg/*.dmg "out/rd-desktop-$v-macos-universal.dmg"
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: rd-desktop-${{ needs.version.outputs.version }}-macos-universal
          path: out/*
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: [version, windows, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # gh release create
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: rd-desktop-*
          path: out
          merge-multiple: true
      - name: Checksums
        run: cd out && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ needs.version.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "rd Desktop $V" \
            --notes "Unsigned builds; see clients/desktop/README.md for installing.

          Windows 10/11 (x64). SmartScreen asks once: More info -> Run anyway.
          - rd-desktop-$V-x64-setup.exe: per-user installer (no admin rights)
          - rd-desktop-$V-x64-portable.exe: single exe, no install

          macOS 12+ (Apple silicon and Intel). First start: System Settings -> Privacy & Security -> Open Anyway. Grabbing Cmd+Tab etc. needs the Accessibility permission (the app asks).
          - rd-desktop-$V-macos-universal.dmg"
