name: Release

# Changesets (https://github.com/changesets/changesets) for rd Desktop.
#
# - A push to main with pending .changeset/*.md files opens or updates the "Version packages"
#   PR: it bumps clients/desktop/package.json, writes clients/desktop/CHANGELOG.md and copies
#   the version into the Tauri crate (tools/release/sync-desktop-version.ts).
# - A push to main without pending changesets (the merged version PR) tags desktop-vX.Y.Z if
#   that tag does not exist yet and starts the Desktop workflow on it, which builds the app and
#   publishes the GitHub Release.
#
# Needs "Allow GitHub Actions to create and approve pull requests" (Settings -> Actions ->
# General). The version PR is pushed with GITHUB_TOKEN, so CI does not run on it by itself.
on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Version PR or tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # version PR branch, desktop-v* tag
      pull-requests: write # version PR
      actions: write # gh workflow run desktop.yml
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      - uses: changesets/action@v2
        id: changesets
        with:
          version-script: bun run version
          commit-message: "Version packages"
          pr-title: "Version packages"
          # Tagging and the GitHub Release are done below and by desktop.yml.
          create-github-releases: false
          push-git-tags: false

      - name: Tag rd Desktop and start its release build
        if: steps.changesets.outputs.has-changesets == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bun run version:check
          v="$(jq -r .version clients/desktop/package.json)"
          tag="desktop-v$v"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "$tag already exists, nothing to release"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "rd Desktop $v"
          git push origin "$tag"
          # A tag pushed with GITHUB_TOKEN starts no workflows; a workflow_dispatch does.
          gh workflow run desktop.yml --ref "$tag"
          echo "Tagged $tag; the Desktop workflow builds and publishes it." >> "$GITHUB_STEP_SUMMARY"
