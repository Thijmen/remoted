[workspace]
resolver = "3"
members = [
  "crates/rd-proto",
  "crates/rd-flow",
  "crates/rd-agent-core",
  "crates/rd-platform-macos",
  "crates/rd-platform-windows",
  "crates/rd-agent",
  "crates/rd-gateway",
]
# Tauri desktop client: its own Cargo.lock, so the workspace (and Linux CI) needs no WebView deps.
exclude = ["clients/desktop"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
rust-version = "1.90"

[workspace.dependencies]
rd-proto = { path = "crates/rd-proto" }
rd-flow = { path = "crates/rd-flow" }
rd-agent-core = { path = "crates/rd-agent-core" }
rd-platform-macos = { path = "crates/rd-platform-macos" }
rd-platform-windows = { path = "crates/rd-platform-windows" }

anyhow = "1"
thiserror = "2"
bytes = "1.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
hex = "0.4"
rand = "0.9"
parking_lot = "0.12"
crossbeam-channel = "0.5"
libc = "0.2"
socket2 = { version = "0.6", features = ["all"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
tracing-appender = "0.2"
clap = { version = "4.6", features = ["derive", "env"] }
toml = "0.9"
url = "2"

tokio = { version = "1.53", features = ["rt-multi-thread", "net", "time", "sync", "macros", "signal", "io-util"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
# rd-agent's updater: a small blocking HTTP client (rustls + ring, webpki roots; no aws-lc) and
# minisign verification as tauri-plugin-updater does it.
ureq = { version = "3.4", default-features = false, features = ["rustls"] }
minisign-verify = "0.3"

axum = { version = "0.8.9", features = ["ws", "macros"] }
tower-http = { version = "0.6", features = ["set-header", "trace"] }
rust-embed = { version = "8.13", features = ["mime-guess"] }
sha2 = "0.10"
subtle = "2.6"
governor = "0.10"

h264-reader = "0.9"
opus = "0.4"

[profile.release]
debug = 1
lto = "thin"
codegen-units = 4
