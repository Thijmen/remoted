<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- rd Desktop's macOS menu bar icon: a template image (macOS uses only its alpha and draws it
       in the menu bar's colour). The letters are cut out of the icon.svg square. Regenerate with:
       rsvg-convert -w 36 -h 36 tray-icon.svg -o src-tauri/icons/tray-template.png -->
  <defs>
    <mask id="letters">
      <rect width="1024" height="1024" fill="#fff"/>
      <g fill="none" stroke="#000" stroke-width="110" stroke-linecap="round" stroke-linejoin="round">
        <path d="M292 740 V430 M292 545 C292 455 372 405 462 415"/>
        <circle cx="607" cy="615" r="125"/>
        <path d="M732 280 V740"/>
      </g>
    </mask>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="#000" mask="url(#letters)"/>
</svg>
