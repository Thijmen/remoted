[package]
name = "rd-agent"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "rd host agent binary"
build = "build.rs"

[[bin]]
name = "rd-agent"
path = "src/main.rs"

[dependencies]
rd-proto = { workspace = true }
rd-agent-core = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
url = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
rd-platform-macos = { workspace = true }
tracing-oslog = "0.3"
libc = { workspace = true }
