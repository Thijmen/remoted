[package]
name = "rd-agent"
version = "1.8.0"
edition.workspace = true
publish.workspace = true
description = "rd host agent binary"
build = "build.rs"

[[bin]]
name = "rd-agent"
path = "src/main.rs"

# Windows background launcher (GUI subsystem: no console window); a stub elsewhere.
[[bin]]
name = "rd-agentw"
path = "src/bin/rd-agentw.rs"

# Windows secure desktop: the LocalSystem service and the SYSTEM helper it launches into the
# console session (docs/setup-windows.md). Stubs elsewhere.
[[bin]]
name = "rd-agent-svc"
path = "src/bin/rd-agent-svc.rs"

[[bin]]
name = "rd-agent-sec"
path = "src/bin/rd-agent-sec.rs"

[dependencies]
rd-proto = { workspace = true }
rd-agent-core = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
url = { workspace = true }
base64 = { workspace = true }
ureq = { workspace = true }
minisign-verify = { workspace = true }

# The menu bar / notification-area icon (src/tray): macOS and Windows only, so Linux builds
# need no GTK.
[target.'cfg(any(target_os = "macos", windows))'.dependencies]
tray-icon = { version = "0.26", default-features = false }
png = "0.18"

[target.'cfg(target_os = "macos")'.dependencies]
rd-platform-macos = { workspace = true }
tracing-oslog = "0.3"
libc = { workspace = true }
objc2 = "0.6"
objc2-foundation = "0.3.2"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
  "std",
  "NSApplication",
  "NSEvent",
  "NSGraphicsContext",
  "NSResponder",
  "NSRunningApplication",
] }
dispatch2 = "0.3"

[target.'cfg(windows)'.dependencies]
rd-platform-windows = { workspace = true }
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_LibraryLoader",
  "Win32_System_ProcessStatus",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }
