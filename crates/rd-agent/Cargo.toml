[package]
name = "rd-agent"
version = "1.6.0"
edition.workspace = true
publish.workspace = true
description = "rd host agent binary"
build = "build.rs"

[[bin]]
name = "rd-agent"
path = "src/main.rs"

# Windows background launcher (GUI subsystem: no console window); a stub elsewhere.
[[bin]]
name = "rd-agentw"
path = "src/bin/rd-agentw.rs"

[dependencies]
rd-proto = { workspace = true }
rd-agent-core = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
url = { workspace = true }
base64 = { workspace = true }
ureq = { workspace = true }
minisign-verify = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
rd-platform-macos = { workspace = true }
tracing-oslog = "0.3"
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
rd-platform-windows = { workspace = true }
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_ProcessStatus",
  "Win32_System_Registry",
  "Win32_System_Threading",
] }
