[package]
name = "rd-gateway"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "rd relay: joins viewer and agent WebSockets, serves portal/viewer/probe"

[lib]
path = "src/lib.rs"

[[bin]]
name = "rd-gateway"
path = "src/main.rs"

[dependencies]
rd-proto = { workspace = true }
rd-flow = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
bytes = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rand = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }
parking_lot = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true, features = ["fs"] }
futures-util = { workspace = true }
axum = { workspace = true }
rust-embed = { workspace = true }
sha2 = { workspace = true }
subtle = { workspace = true }
governor = { workspace = true }
mime_guess = "2.0.5"

[dev-dependencies]
tokio = { workspace = true, features = ["fs", "test-util"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake"] }
hyper = { version = "1.12", features = ["client", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
http-body-util = "0.1.5"
