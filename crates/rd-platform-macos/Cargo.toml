[package]
name = "rd-platform-macos"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "macOS platform for the rd agent: ScreenCaptureKit capture, VideoToolbox H.264, CGEvent input, IOPM, Keychain"

[target.'cfg(target_os = "macos")'.dependencies]
rd-proto = { workspace = true }
rd-agent-core = { workspace = true }
anyhow = { workspace = true }
bytes = { workspace = true }
tracing = { workspace = true }
parking_lot = { workspace = true }
crossbeam-channel = { workspace = true }
libc = { workspace = true }
tokio = { workspace = true }
serde_json = { workspace = true }
screencapturekit = { version = "11.0.0", features = ["macos_15_0"] }
objc2 = "0.6"
block2 = "0.6"
dispatch2 = "0.3"
objc2-foundation = "0.3.2"
objc2-core-foundation = "0.3.2"
objc2-core-media = { version = "0.3.2", features = ["objc2-core-video"] }
objc2-core-video = "0.3.2"
objc2-video-toolbox = { version = "0.3.2", features = ["objc2-core-media", "objc2-core-video"] }
objc2-core-graphics = "0.3.2"
objc2-io-kit = "0.3.2"
security-framework = "3.7"
security-framework-sys = "2.17"

[target.'cfg(target_os = "macos")'.dev-dependencies]
clap = { workspace = true }
tracing-subscriber = { workspace = true }

[[example]]
name = "selftest"
path = "examples/selftest.rs"
