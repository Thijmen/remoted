[package]
name = "rd-platform-windows"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Windows platform for the rd agent: DXGI Desktop Duplication, Media Foundation H.264, SendInput, power requests"

[target.'cfg(windows)'.dependencies]
rd-proto = { workspace = true }
rd-agent-core = { workspace = true }
anyhow = { workspace = true }
bytes = { workspace = true }
tracing = { workspace = true }
parking_lot = { workspace = true }
crossbeam-channel = { workspace = true }
tokio = { workspace = true }
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_Media",
  "Win32_Media_MediaFoundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Power",
  "Win32_System_Ole",
  "Win32_System_ProcessStatus",
  "Win32_System_Registry",
  "Win32_System_RemoteDesktop",
  "Win32_System_StationsAndDesktops",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.dev-dependencies]
# examples/animate.rs
windows = { version = "0.62", features = ["Win32_System_LibraryLoader"] }

# Lists monitors, adapters, outputs and H.264 encoders.
[[example]]
name = "probe"
path = "examples/probe.rs"

# Animates a window (and the pointer) on the primary display, for capture measurements.
[[example]]
name = "animate"
path = "examples/animate.rs"
